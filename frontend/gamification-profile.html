<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUMINTERN - Gamification Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        midnight: { 950: '#020617', 900: '#0a0e1a', 800: '#0f1629', 700: '#141d35' },
                        electric: { DEFAULT: '#00d4ff', light: '#33ddff', dark: '#00a8cc' }
                    },
                    fontFamily: { 'inter': ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        .gradient-text {
            background: linear-gradient(135deg, #00d4ff 0%, #0891b2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .level-badge { background: linear-gradient(135deg, #10b981, #059669); }
        .xp-bar { transition: width 1s ease-out; }
        .glow { box-shadow: 0 0 30px rgba(0, 212, 255, 0.3); }
    </style>
</head>
<body class="font-inter bg-midnight-950 text-white antialiased min-h-screen">
    
    <!-- Navigation -->
    <nav class="bg-midnight-900 border-b border-slate-800 p-4">
        <div class="max-w-6xl mx-auto flex items-center justify-between">
            <a href="index.html" class="flex items-center space-x-2">
                <div class="w-10 h-10 rounded-lg bg-gradient-to-br from-electric to-cyan-600 flex items-center justify-center">
                    <svg class="w-6 h-6 text-midnight-950" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                </div>
                <span class="text-xl font-bold"><span class="text-white">LUM</span><span class="gradient-text">INTERN</span></span>
            </a>
            <div class="flex items-center space-x-4">
                <a href="index.html" class="text-gray-400 hover:text-electric transition-colors text-sm">Home</a>
                <a href="dashboard.html" class="text-gray-400 hover:text-electric transition-colors text-sm">Dashboard</a>
                <a href="register.html" class="px-4 py-2 bg-gradient-to-r from-electric to-cyan-600 text-midnight-900 font-semibold rounded-lg text-sm">Sign Up</a>
            </div>
        </div>
    </nav>
    
    <div class="max-w-2xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- Profile Card -->
        <div class="bg-midnight-900 border border-slate-800 rounded-2xl overflow-hidden">
            <div class="h-32 bg-gradient-to-r from-electric/20 to-cyan-600/20 relative">
                <div class="absolute -bottom-12 left-8">
                    <div class="w-24 h-24 rounded-2xl bg-gradient-to-br from-electric to-cyan-600 flex items-center justify-center text-midnight-950 font-bold text-3xl border-4 border-midnight-900">AJ</div>
                </div>
            </div>
            <div class="pt-16 px-8 pb-8">
                <div class="flex items-start justify-between mb-6">
                    <div>
                        <h1 class="text-2xl font-bold text-white">Alex Johnson</h1>
                        <p class="text-gray-400">MIT • 3rd Year</p>
                    </div>
                    <div class="level-badge px-4 py-2 rounded-full">
                        <span class="text-sm font-bold text-white">Lv.3 Contributor</span>
                    </div>
                </div>
                
                <div class="bg-slate-800/50 rounded-xl p-6 mb-6">
                    <div class="flex items-center justify-between mb-3">
                        <div>
                            <div class="text-sm text-gray-400">Experience Points</div>
                            <div class="text-3xl font-bold text-electric">1,250 XP</div>
                        </div>
                        <div class="text-right">
                            <div class="text-sm text-gray-400">Next Level</div>
                            <div class="text-lg font-semibold text-white">750 XP needed</div>
                        </div>
                    </div>
                    <div class="h-4 bg-slate-700 rounded-full overflow-hidden">
                        <div class="xp-bar h-full bg-gradient-to-r from-electric to-cyan-600 rounded-full" style="width: 7%"></div>
                    </div>
                </div>
                
                <div class="grid grid-cols-3 gap-4 mb-6">
                    <div class="bg-slate-800/50 rounded-xl p-4 text-center">
                        <div class="text-2xl font-bold text-white">23</div>
                        <div class="text-xs text-gray-400">Tasks Completed</div>
                    </div>
                    <div class="bg-slate-800/50 rounded-xl p-4 text-center">
                        <div class="text-2xl font-bold text-success">$2,450</div>
                        <div class="text-xs text-gray-400">Total Earnings</div>
                    </div>
                    <div class="bg-slate-800/50 rounded-xl p-4 text-center">
                        <div class="text-2xl font-bold text-warning">4.8 ⭐</div>
                        <div class="text-xs text-gray-400">Rating</div>
                    </div>
                </div>
                
                <a href="dashboard.html" class="block w-full text-center px-6 py-3 bg-gradient-to-r from-electric to-cyan-600 text-midnight-900 font-semibold rounded-xl hover:shadow-lg transition-all">
                    Browse Tasks
                </a>
            </div>
        </div>
    </div>
    
    <script src="config.js"></script>
</body>
</html>
