<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUMINTERN - Gamification Profile</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts - Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        midnight: { 950: '#020617', 900: '#0a0e1a', 800: '#0f1629', 700: '#141d35' },
                        electric: { DEFAULT: '#00d4ff', light: '#33ddff', dark: '#00a8cc' }
                    },
                    fontFamily: { 'inter': ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
    
    <style>
        .level-badge {
            background: linear-gradient(135deg, #10b981, #059669);
        }
        .xp-bar {
            transition: width 1s ease-out;
        }
        .glow {
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.3);
        }
    </style>
</head>
<body class="font-inter bg-midnight-950 text-white antialiased min-h-screen p-8">
    
    <div class="max-w-2xl mx-auto">
        <!-- Profile Card -->
        <div class="bg-midnight-900 border border-slate-800 rounded-2xl overflow-hidden">
            <!-- Header Banner -->
            <div class="h-32 bg-gradient-to-r from-electric/20 to-cyan-600/20 relative">
                <div class="absolute -bottom-12 left-8">
                    <div class="w-24 h-24 rounded-2xl bg-gradient-to-br from-electric to-cyan-600 flex items-center justify-center text-midnight-950 font-bold text-3xl border-4 border-midnight-900">
                        AJ
                    </div>
                </div>
            </div>
            
            <!-- Profile Info -->
            <div class="pt-16 px-8 pb-8">
                <div class="flex items-start justify-between mb-6">
                    <div>
                        <h1 class="text-2xl font-bold text-white">Alex Johnson</h1>
                        <p class="text-gray-400">MIT • 3rd Year</p>
                    </div>
                    <div id="level-badge" class="level-badge px-4 py-2 rounded-full">
                        <span class="text-sm font-bold text-white">Lv.3 Contributor</span>
                    </div>
                </div>
                
                <!-- XP Progress -->
                <div class="bg-slate-800/50 rounded-xl p-6 mb-6">
                    <div class="flex items-center justify-between mb-3">
                        <div>
                            <div class="text-sm text-gray-400">Experience Points</div>
                            <div class="text-3xl font-bold text-electric" id="total-xp">1,250 XP</div>
                        </div>
                        <div class="text-right">
                            <div class="text-sm text-gray-400">Next Level</div>
                            <div class="text-lg font-semibold text-white" id="xp-needed">750 XP needed</div>
                        </div>
                    </div>
                    
                    <!-- Progress Bar -->
                    <div class="h-4 bg-slate-700 rounded-full overflow-hidden">
                        <div id="xp-bar" class="xp-bar h-full bg-gradient-to-r from-electric to-cyan-600 rounded-full" style="width: 7%"></div>
                    </div>
                    
                    <div class="flex justify-between mt-2 text-xs text-gray-500">
                        <span id="current-level-xp">1,200 XP</span>
                        <span id="next-level-xp">2,000 XP</span>
                    </div>
                </div>
                
                <!-- Stats Grid -->
                <div class="grid grid-cols-3 gap-4 mb-6">
                    <div class="bg-slate-800/50 rounded-xl p-4 text-center">
                        <div class="text-2xl font-bold text-white" id="completed-tasks">23</div>
                        <div class="text-xs text-gray-400">Tasks Completed</div>
                    </div>
                    <div class="bg-slate-800/50 rounded-xl p-4 text-center">
                        <div class="text-2xl font-bold text-success" id="total-earnings">$2,450</div>
                        <div class="text-xs text-gray-400">Total Earnings</div>
                    </div>
                    <div class="bg-slate-800/50 rounded-xl p-4 text-center">
                        <div class="text-2xl font-bold text-warning" id="rating">4.8 ⭐</div>
                        <div class="text-xs text-gray-400">Rating</div>
                    </div>
                </div>
                
                <!-- Level Progression -->
                <div class="bg-slate-800/50 rounded-xl p-6">
                    <h3 class="text-sm font-semibold text-gray-400 uppercase mb-4">Level Progression</h3>
                    <div class="space-y-3" id="level-timeline">
                        <!-- Levels will be inserted here -->
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Leaderboard Preview -->
        <div class="mt-8 bg-midnight-900 border border-slate-800 rounded-2xl p-6">
            <h2 class="text-lg font-semibold text-white mb-4">🏆 Top Freshers Leaderboard</h2>
            <div class="space-y-3" id="leaderboard">
                <!-- Leaderboard items will be inserted here -->
            </div>
        </div>
    </div>
    
    <script>
        // Mock data (in production, fetch from API)
        const gamificationData = {
            experiencePoints: 1250,
            platformLevel: 3,
            levelTitle: 'Contributor',
            completedTasks: 23,
            totalEarnings: 2450,
            rating: 4.8,
            progress: {
                progress: 7,
                xpNeeded: 750,
                currentLevelXP: 1200,
                nextLevelXP: 2000
            }
        };
        
        const levels = [
            { level: 1, xp: 0, title: 'Newcomer', color: 'gray' },
            { level: 2, xp: 500, title: 'Apprentice', color: 'gray' },
            { level: 3, xp: 1200, title: 'Contributor', color: 'green' },
            { level: 4, xp: 2000, title: 'Specialist', color: 'cyan' },
            { level: 5, xp: 3500, title: 'Expert', color: 'cyan' },
            { level: 6, xp: 5000, title: 'Master', color: 'purple' },
            { level: 7, xp: 7500, title: 'Veteran', color: 'purple' },
            { level: 8, xp: 10000, title: 'Champion', color: 'amber' },
            { level: 9, xp: 15000, title: 'Legend', color: 'amber' },
            { level: 10, xp: 20000, title: 'Grandmaster', color: 'yellow' },
        ];
        
        const leaderboardData = [
            { rank: 1, name: 'Sarah Kim', xp: 5200, level: 6, college: 'Stanford' },
            { rank: 2, name: 'Rahul Sharma', xp: 4800, level: 5, college: 'IIT Delhi' },
            { rank: 3, name: 'Alex Johnson', xp: 1250, level: 3, college: 'MIT' },
            { rank: 4, name: 'Priya Patel', xp: 1100, level: 3, college: 'BITS Pilani' },
            { rank: 5, name: 'Michael Chen', xp: 950, level: 2, college: 'UC Berkeley' },
        ];
        
        // Render profile
        function renderProfile() {
            const data = gamificationData;
            
            document.getElementById('total-xp').textContent = data.experiencePoints.toLocaleString() + ' XP';
            document.getElementById('xp-needed').textContent = data.progress.xpNeeded.toLocaleString() + ' XP needed';
            document.getElementById('xp-bar').style.width = data.progress.progress + '%';
            document.getElementById('current-level-xp').textContent = data.progress.currentLevelXP.toLocaleString() + ' XP';
            document.getElementById('next-level-xp').textContent = data.progress.nextLevelXP.toLocaleString() + ' XP';
            document.getElementById('completed-tasks').textContent = data.completedTasks;
            document.getElementById('total-earnings').textContent = '$' + data.totalEarnings.toLocaleString();
            document.getElementById('rating').textContent = data.rating + ' ⭐';
            
            // Update level badge
            const badge = document.getElementById('level-badge');
            badge.innerHTML = `<span class="text-sm font-bold text-white">Lv.${data.platformLevel} ${data.levelTitle}</span>`;
        }
        
        // Render level timeline
        function renderLevelTimeline() {
            const container = document.getElementById('level-timeline');
            const currentLevel = gamificationData.platformLevel;
            const currentXP = gamificationData.experiencePoints;
            
            container.innerHTML = levels.map(level => {
                const isUnlocked = currentLevel >= level.level;
                const isCurrent = currentLevel === level.level;
                const progress = isCurrent ? gamificationData.progress.progress : (isUnlocked ? 100 : 0);
                
                return `
                    <div class="flex items-center space-x-4 ${isUnlocked ? 'opacity-100' : 'opacity-40'}">
                        <div class="w-10 h-10 rounded-full flex items-center justify-center flex-shrink-0 ${
                            isCurrent ? 'bg-electric text-midnight-950 glow' :
                            isUnlocked ? 'bg-success/20 text-success' :
                            'bg-slate-700 text-gray-500'
                        }">
                            ${isUnlocked ? '✓' : level.level}
                        </div>
                        <div class="flex-1">
                            <div class="flex items-center justify-between">
                                <span class="text-sm font-medium ${isCurrent ? 'text-electric' : 'text-white'}">
                                    Lv.${level.level} ${level.title}
                                </span>
                                <span class="text-xs text-gray-500">${level.xp.toLocaleString()} XP</span>
                            </div>
                            ${isCurrent ? `
                                <div class="h-1.5 bg-slate-700 rounded-full mt-1 overflow-hidden">
                                    <div class="h-full bg-electric rounded-full" style="width: ${progress}%"></div>
                                </div>
                            ` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        // Render leaderboard
        function renderLeaderboard() {
            const container = document.getElementById('leaderboard');
            
            container.innerHTML = leaderboardData.map((item, index) => {
                const isCurrentUser = item.name === 'Alex Johnson';
                const medal = index === 0 ? '🥇' : index === 1 ? '🥈' : index === 2 ? '🥉' : `#${item.rank}`;
                
                return `
                    <div class="flex items-center space-x-4 p-3 rounded-xl ${isCurrentUser ? 'bg-electric/10 border border-electric/30' : 'bg-slate-800/30'}">
                        <div class="w-8 text-center font-bold ${index < 3 ? 'text-xl' : 'text-sm text-gray-400'}">
                            ${medal}
                        </div>
                        <div class="w-10 h-10 rounded-full bg-gradient-to-br from-electric to-cyan-600 flex items-center justify-center text-midnight-950 font-bold text-sm">
                            ${item.name.split(' ').map(n => n[0]).join('')}
                        </div>
                        <div class="flex-1">
                            <div class="font-medium text-sm ${isCurrentUser ? 'text-electric' : 'text-white'}">
                                ${item.name} ${isCurrentUser ? '(You)' : ''}
                            </div>
                            <div class="text-xs text-gray-400">${item.college}</div>
                        </div>
                        <div class="text-right">
                            <div class="text-sm font-semibold text-white">${item.xp.toLocaleString()} XP</div>
                            <div class="text-xs text-gray-400">Lv.${item.level}</div>
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            renderProfile();
            renderLevelTimeline();
            renderLeaderboard();
        });
    </script>
</body>
</html>
