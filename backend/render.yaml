# ====================
# Render Blueprint Configuration
# ====================
# This file configures automatic deployment on Render.com

services:
  # Backend API Service
  - type: web
    name: lumintern-api
    runtime: node
    region: oregon  # or frankfurt, singapore based on your users
    plan: free      # Free tier - upgrade for production
    branch: main
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    autoDeploy: true
    
    # Environment Variables
    envVars:
      - key: NODE_ENV
        value: production
      
      - key: PORT
        value: 10000
      
      - key: MONGODB_URI
        sync: false  # Set manually in dashboard for security
      
      - key: JWT_SECRET
        generateValue: true  # Auto-generate secure secret
      
      - key: JWT_EXPIRES_IN
        value: 7d
      
      - key: FRONTEND_URL
        value: https://lumintern.netlify.app
      
      - key: CLIENT_URL
        value: https://lumintern.netlify.app
      
      - key: RATE_LIMIT_WINDOW_MS
        value: 900000
      
      - key: RATE_LIMIT_MAX_REQUESTS
        value: 100

    # Auto-scaling (for paid plans)
    # scaling:
    #   minInstances: 1
    #   maxInstances: 3